[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rvbinary"
version = "0.3.1"
description = "Deterministic binary-star radial-velocity inference"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
authors = [
  { name = "Tian Qiu" },
]
dependencies = [
  "astropy>=5.3,<8",
  "emcee>=3.1,<4",
  "h5py>=3.10,<4",
  "Jinja2>=3.1,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.22,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gui = [
  "streamlit>=1.51,<2",
]
mpi = [
  "mpi4py>=3.1,<5",
]
test = [
  "mypy>=1.11,<3",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "types-PyYAML>=6,<7",
]
release = [
  "build>=1.2,<2",
  "twine>=5,<8",
]

[project.scripts]
rvbinary = "rvbinary.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvbinary = ["templates/*.j2", "data/*.dat", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mpi: tests that require execution under multiple MPI ranks",
  "mpi_hdf5: tests that require an MPI-enabled h5py build",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "rvbinary.cli",
  "rvbinary.parallel",
  "rvbinary.plotting",
  "rvbinary.workflow.runner",
]
ignore_errors = true
